name: Validate landing page

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Validate static assets and page structure
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              pass

          html = Path('index.html').read_text(encoding='utf-8')
          Parser().feed(html)

          assets = ('styles.css', 'enhancements.css', 'app.js', 'favicon.svg')
          for asset in assets:
              if asset not in html:
                  raise SystemExit(f'Missing asset reference: {asset}')
              if not Path(asset).exists():
                  raise SystemExit(f'Missing asset file: {asset}')

          for css_file in ('styles.css', 'enhancements.css'):
              css = Path(css_file).read_text(encoding='utf-8')
              if css.count('{') != css.count('}'):
                  raise SystemExit(f'Unbalanced CSS braces: {css_file}')

          required_sections = ('how-it-works', 'signal', 'stack', 'evidence', 'digest', 'faq', 'early-access')
          for section_id in required_sections:
              if f'id="{section_id}"' not in html:
                  raise SystemExit(f'Missing section: {section_id}')

          required_copy = (
              'Only the changes',
              'Human-reviewed',
              'Request founding pilot',
              'Evidence hierarchy',
              'Illustrative feed',
          )
          for phrase in required_copy:
              if phrase not in html:
                  raise SystemExit(f'Missing required positioning copy: {phrase}')

          pilot_template = Path('.github/ISSUE_TEMPLATE/pilot.yml')
          if not pilot_template.exists():
              raise SystemExit('Missing founding pilot issue template')

          print('Static landing page validation passed.')
          PY
